[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Top-level importable modules of the bot (config is imported by both the
# Discord bot and the desktop companion; stt_eval by manage.py).
py-modules = ["config", "stt_eval"]

[tool.setuptools.packages.find]
where = ["."]
# Explicit package list: the bot + desktop companion. Everything else at
# the root (datasets, tooling, vendored experiments) is not part of the
# installable package. Desktop tools/ are dev probes, not runtime code.
include = [
    "ai", "ai.*",
    "bot", "bot.*",
    "cogs", "cogs.*",
    "character", "character.*",
    "desktop", "desktop.*",
    "emotion", "emotion.*",
    "health", "health.*",
    "memory", "memory.*",
    "metrics", "metrics.*",
    "reddit", "reddit.*",
    "social", "social.*",
    "state", "state.*",
    "voice", "voice.*",
]
exclude = ["tests*", "_legacy*", "venv*", "__pycache__*"]

[project]
name = "aliceshimadabot"
version = "2.0.0"
description = "A modular Discord character bot for Alice Shimada"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "openai>=1.40.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.0",
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0.0",
    "redis>=5.0.0",
    "aiohttp>=3.9.0",
]
optional-dependencies = { dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    # Type stubs needed by `mypy .` in CI (see [tool.mypy])
    "types-pywin32",
    "scipy-stubs",
] }

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "_legacy", "venv", "__pycache__", "data", "logs",
    # One-off dataset tooling, never published (see .gitignore)
    "AliceVoiceExtraction",
    # Retired overlay-era probes kept on disk only (see .gitignore)
    "desktop/tools/alpha_test.py",
    "desktop/tools/composition_bench.py",
    "desktop/tools/overlay_cycle_test.py",
    "desktop/tools/probe_live_overlay.py",
    "desktop/tools/verify_live_overlay.py",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "T20",
]
ignore = [
    "E501", "B008", "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# CLI / maintenance entry points: stdout output IS the interface
"manage.py" = ["T201", "E402"]
"stt_eval.py" = ["T201", "E741"]
"desktop/cli.py" = ["T201", "E402"]
"desktop/app.py" = ["T201", "E402"]                     # T201: debug-console prints
"desktop/discord_service.py" = ["T201", "E402"]
"desktop/convert/*" = ["T201", "B023", "UP031"]          # B023: closures are consumed within the same loop iteration; UP031: printf style throughout - this tool's output is hash-verified, don't churn it
"desktop/sovits_patch/*" = ["T201"]
"desktop/tools/make_icon.py" = ["T201"]
# Deliberate import-time work between imports:
# voice/__init__ applies the DAVE monkey-patches before the pipeline import;
# streaming_source imports discord after its compat block
"voice/__init__.py" = ["E402"]
"voice/streaming_source.py" = ["E402"]
"desktop/voice_app.py" = ["E402"]
"main.py" = ["E402"]
# RVC's own modules read these exact lowercase env-var names - their contract
"voice/rvc.py" = ["SIM112"]
"tests/*" = ["S101", "T201", "E731", "E402"]
"_legacy/*" = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "_legacy", "venv", "__pycache__", "tests", "data", "logs",
    # One-off dataset tooling and retired overlay probes (never published)
    "AliceVoiceExtraction",
    "desktop/tools/alpha_test.py",
    "desktop/tools/composition_bench.py",
    "desktop/tools/overlay_cycle_test.py",
    "desktop/tools/probe_live_overlay.py",
    "desktop/tools/verify_live_overlay.py",
]
disable_error_code = [
    "attr-defined",      # Bot attributes not recognized
    "union-attr",        # Channel union types
    "arg-type",          # openai message types
    "method-assign",     # tree.on_error assignment
    "var-annotated",     # discord UI component annotations
    "annotation-unchecked",  # consistent with check_untyped_defs=false below
]

[[tool.mypy.overrides]]
module = [
    "discord", "openai", "requests", "dotenv", "jinja2",
    "prometheus_client", "pythonjsonlogger.json", "redis", "aiohttp",
    # Hardware/ML packages without stubs or py.typed markers
    "sounddevice", "aec_audio_processing", "silero_vad",
    "faster_whisper", "torchaudio", "soundfile", "pystray",
    "noisereduce",
    # RVC's own repo modules (loaded via sys.path injection into D:\RVC)
    "configs.config", "infer.*", "text",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=./ --cov-report=term-missing --cov-report=xml --cov-fail-under=24"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*", "venv/*", "__pycache__/*", "_legacy/*",
    "manage.py", "main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]