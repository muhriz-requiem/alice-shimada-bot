[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "_legacy*", "venv*", "__pycache__*"]

[project]
name = "aliceshimadabot"
version = "2.0.0"
description = "A modular Discord character bot for Alice Shimada"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "openai>=1.40.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.0",
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0.0",
    "redis>=5.0.0",
    "aiohttp>=3.9.0",
]
optional-dependencies = { dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
] }

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "T20",
]
ignore = [
    "E501", "B008", "SIM102",
]
per-file-ignores = { "tests/*" = ["S101", "T201"], "_legacy/*" = [] }
exclude = ["_legacy", "venv", "__pycache__", "data", "logs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = ["_legacy", "venv", "__pycache__", "tests", "data", "logs"]
disable_error_code = [
    "attr-defined",      # Bot attributes not recognized
    "union-attr",        # Channel union types
    "arg-type",          # openai message types
    "method-assign",     # tree.on_error assignment
    "var-annotated",     # discord UI component annotations
]

[[tool.mypy.overrides]]
module = [
    "discord", "openai", "requests", "dotenv", "jinja2",
    "prometheus_client", "python_json_logger", "redis", "aiohttp",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=./ --cov-report=term-missing --cov-report=xml --cov-fail-under=24"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*", "venv/*", "__pycache__/*", "_legacy/*",
    "manage.py", "main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]